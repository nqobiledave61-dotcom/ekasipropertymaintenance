<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Get a Quote - Ekasi Property Maintenance</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="Request a free quote for property maintenance services in Soweto.">
    <meta name="keywords" content="quote, property maintenance, Soweto, renovations, plumbing">
</head>
<body>
    <header>
        <h1>Ekasi Property Maintenance</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="gallery.html">Gallery</a> |
            <a href="aboutus.html">About Us</a> |
            <a href="contactus.html">Contact Us</a> |
            <a href="getaquote.html">Get a Quote</a>
        </nav>
    </header>

    <main>
        <h2>Request a Free Quote</h2>
        <form id="quoteForm">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
            <label for="project">Project Type:</label>
            <input type="text" id="project" name="project" required>
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
            <input type="submit" value="Submit Request">
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ekasi Property Maintenance | Soweto, Johannesburg</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
