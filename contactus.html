<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Ekasi Property Maintenance</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <meta name="description" content="Contact Ekasi Property Maintenance for enquiries, quotes, and support in Soweto.">
  <meta name="keywords" content="contact, property maintenance, Soweto, enquiries, quotes">
</head>
<body>
  <header>
    <h1>Ekasi Property Maintenance</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="aboutus.html">About Us</a>
      <a href="contactus.html">Contact Us</a>
      <a href="getaquote.html">Get a Quote</a>
    </nav>
  </header>

  <main>
    <h2>Get in Touch</h2>
    <form id="contactForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <input type="submit" value="Send">
    </form>

    <div id="map" style="height:400px;"></div>
  </main>

  <footer>
    <p>&copy; 2026 Ekasi Property Maintenance | Soweto, Johannesburg</p>
  </footer>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
